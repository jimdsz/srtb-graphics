<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Contrôle des textes animés</title><style>body{background:#191c1e;color:white;font:16px sans-serif;margin:20px}button,select,input{padding:12px;margin:6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scene{aspect-ratio:16/9;position:relative;background:#30383f}.scene>*{display:block;width:100%;height:100%}pre{white-space:pre-wrap}svg{overflow:visible}</style></head><body><h1>Contrôle des textes animés</h1><p>Comparaison locale, sans média ni modification de projet.</p><label>Modèle <select id="model"><option>BTV_Semainier</option><option>BTV_Evenement</option><option>BTV_Renvoi</option></select></label><label>Temps <input id="time" type="number" value="4.92" step="0.04"></label><button id="run">Comparer le style à 100 %</button><button id="qualify">Qualifier les transitions et le rendu export</button><div class="pair"><section><h2>Natif</h2><div id="native" class="scene"></div></section><section><h2>Édité</h2><div id="edited" class="scene"></div></section></div><pre id="result" role="status"></pre><script type="module" src="./ae-text-mask.bundle.js"></script></body></html>
