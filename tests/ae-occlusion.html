<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Diagnostic des plans After Effects</title><style>body{background:#171b1e;color:#fff;font:16px sans-serif;padding:18px}label,button{margin:8px}input,button{padding:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scene{aspect-ratio:16/9;background:repeating-conic-gradient(#252b25 0% 25%,#2c332c 0% 50%) 0/24px 24px}.scene>*{display:block;width:100%;height:100%}pre{white-space:pre-wrap}</style></head><body><h1>Semainier — contrôle des plans</h1><p>Deux rendus identiques, sans média puis avec une image opaque de contrôle. Aucun projet enregistré.</p><label>Temps <input id="time" value="2.56" type="number" step="0.04"></label><button id="run">Comparer</button><div class="pair"><section><h2>Sans média</h2><div id="empty" class="scene"></div></section><section><h2>Avec un média neutre</h2><div id="media" class="scene"></div></section></div><pre id="result" role="status"></pre><script type="module" src="./ae-occlusion.js"></script></body></html>
